<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.55" stop-color="#2bff88"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- subtle tech grid -->
  <g stroke="#00f0ff" stroke-opacity="0.10" stroke-width="2">
    <path d="M0 128 H512 M0 256 H512 M0 384 H512 M128 0 V512 M256 0 V512 M384 0 V512"/>
  </g>

  <!-- hex frame -->
  <polygon points="256,72 408,160 408,352 256,440 104,352 104,160"
           fill="none" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="8"/>
  <polygon points="256,98 386,173 386,339 256,414 126,339 126,173"
           fill="#00f0ff" fill-opacity="0.05"/>

  <!-- lightning bolt -->
  <g filter="url(#glow)">
    <path d="M286 120 L176 280 H246 L226 392 L344 224 H272 Z"
          fill="url(#bolt)" stroke="#eafffb" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
