<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2c"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#ff5c9d"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- full-bleed rounded background (maskable safe) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#bolt)" stroke-opacity="0.35" stroke-width="10"/>

  <!-- lightning bolt -->
  <g filter="url(#glow)">
    <path d="M292 116 L170 286 H244 L220 396 L350 222 H272 Z"
          fill="url(#bolt)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
