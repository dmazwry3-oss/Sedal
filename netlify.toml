# ===========================================================================
# XEMOZ // MEDIA INJECTION CONSOLE — Netlify configuration
# ===========================================================================

[build]
  # Static site — no build step. Everything is published from the repo root.
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Global fetch() is available on Node 18+. Pin a modern runtime.
  NODE_VERSION = "20"

# Friendly alias: /api/proxy?... -> the serverless function
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

# SPA-ish fallback so deep links still load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Don't shadow real assets / functions
  force = false

# Reasonable security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Service worker must be revalidated every load and allowed root scope
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Web app manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Icons / static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions]
  # Bundle with esbuild for fast cold starts
  node_bundler = "esbuild"
